# Reconstruye el sitio cada madrugada (00:05, hora del centro de México).
#
# El sitio es estático: lo que depende de la fecha (si hay edición del reto
# abierta, el botón de compra de /empieza, la próxima fecha del taller) se
# decide al construir. Sin esto, si nadie publica en una semana, /empieza
# seguiría vendiendo una edición que ya pasó. El navegador ya esconde los
# anuncios a tiempo (lib/reto-vivo.ts); esto pone al día lo demás.
#
# No despliega desde aquí: llama al Deploy Hook de Vercel, que construye
# `main` tal como está en GitHub (la regla de AGENTS.md sigue en pie).
# El hook se crea en Vercel (Settings → Git → Deploy Hooks, rama main) y su
# URL va en el secreto VERCEL_DEPLOY_HOOK. Sin secreto, el job no hace nada.
name: Reconstruir diario

on:
  schedule:
    - cron: "5 6 * * *"
  workflow_dispatch:

jobs:
  reconstruir:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al Deploy Hook de Vercel
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Falta el secreto VERCEL_DEPLOY_HOOK; no se reconstruye."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
